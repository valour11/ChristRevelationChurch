<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maintenance | Bantar Ministry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --brand: #28ae4b;
        --brand-dark: #1e8a3a;
        --ink: #132017;
        --muted: #58705f;
        --paper: #f7fbf4;
        --line: rgba(30, 138, 58, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 18%, rgba(40, 174, 75, 0.22), transparent 30rem),
          linear-gradient(135deg, #fbfff8 0%, #eef8ec 52%, #f8fbf3 100%);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 4rem);
      }

      .shell {
        width: min(100%, 960px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 18rem;
        gap: clamp(2rem, 5vw, 4.5rem);
        align-items: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0 0 1.25rem;
        color: var(--brand-dark);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 0.72rem;
        height: 0.72rem;
        border-radius: 999px;
        background: var(--brand);
        box-shadow: 0 0 0 0.4rem rgba(40, 174, 75, 0.14);
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(3rem, 9vw, 7.4rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        max-width: 38rem;
        margin: 1.4rem 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.75;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
        margin-top: 2rem;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.72rem 1rem;
        background: rgba(255, 255, 255, 0.72);
        color: #264b31;
        font-size: 0.92rem;
        font-weight: 700;
        backdrop-filter: blur(12px);
      }

      .mark {
        position: relative;
        aspect-ratio: 1;
        border-radius: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.7);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(230, 247, 235, 0.7)),
          repeating-linear-gradient(135deg, rgba(40, 174, 75, 0.14) 0 1px, transparent 1px 18px);
        box-shadow: 0 2rem 5rem rgba(24, 89, 40, 0.16);
        overflow: hidden;
      }

      .mark::before,
      .mark::after {
        content: "";
        position: absolute;
        inset: 18%;
        border: 1.2rem solid var(--brand);
      }

      .mark::before {
        border-left: 0;
        border-bottom: 0;
        transform: rotate(45deg);
      }

      .mark::after {
        inset: 34% 39%;
        border-width: 0;
        border-radius: 999px;
        background: var(--brand-dark);
        box-shadow:
          -3.2rem 0 0 rgba(40, 174, 75, 0.28),
          3.2rem 0 0 rgba(40, 174, 75, 0.28);
      }

      @media (max-width: 760px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .mark {
          width: min(100%, 15rem);
          order: -1;
          border-radius: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="maintenance-title">
        <div>
          <p class="eyebrow">Scheduled maintenance</p>
          <h1 id="maintenance-title">We are refreshing the site.</h1>
          <p>
            Christ Revelation Church is currently updating this website. Please check back soon for
            service details, prayer requests, school registration, and ministry updates.
          </p>
          <div class="details" aria-label="Maintenance details">
            <span class="pill">Bantar Ministry</span>
            <span class="pill">Temporarily offline</span>
            <span class="pill">Returning shortly</span>
          </div>
        </div>
        <div class="mark" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
